[package]
name = "suja-model-openai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenAI-compatible backend of suja: Chat Completions with streamed tool calls (LM Studio, Ollama, llama-server, vLLM, OpenAI)"

[dependencies]
suja-model = { workspace = true }
suja-model-http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }

[lints]
workspace = true
