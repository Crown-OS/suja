[package]
name = "suja-model-http"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP parts shared by the remote model backends of suja: credentials, server-sent events, errors"

[dependencies]
suja-model = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
serde_json = { workspace = true, optional = true }

[features]
fake-server = ["dep:serde_json", "tokio/net", "tokio/io-util", "tokio/rt"]

[lints]
workspace = true
