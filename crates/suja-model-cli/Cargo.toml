[package]
name = "suja-model-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent CLIs as suja experts: Claude Code (`claude -p`) and Codex (`codex exec`) with their own read-only tools"

[dependencies]
suja-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "process", "io-util"] }
dirs = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs"] }

[lints]
workspace = true
